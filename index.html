<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Chrona · demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Clickable demo of Chrona, a calendar that schedules your tasks for you.">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/setup.css">

  <script src="js/spaces-cats.js"></script>
  <script src="js/screens/signin.js"></script>
